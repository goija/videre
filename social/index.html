<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestandsbeheer - Repository</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --container-bg: #161b22;
            --text-primary: #c9d1d9;
            --text-secondary: #8b949e;
            --border-color: #30363d;
            --link-color: #58a6ff;
            --row-hover: #1f2428;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        .repository-container {
            width: 100%;
            max-width: 900px;
        }

        .header-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .search-box {
            padding: 8px 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            width: 250px;
        }

        .search-box:focus {
            outline: none;
            border-color: var(--link-color);
        }

        .file-table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
        }

        .file-table th {
            text-align: left;
            padding: 12px 16px;
            background-color: #161b22;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 14px;
        }

        .file-table td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
        }

        .file-table tr:last-child td {
            border-bottom: none;
        }

        .file-table tbody tr:hover {
            background-color: var(--row-hover);
        }

        .file-icon {
            margin-right: 10px;
            color: var(--text-secondary);
        }

        .file-name {
            color: var(--text-primary);
            text-decoration: none;
        }

        .file-name:hover {
            color: var(--link-color);
            text-decoration: underline;
        }

        .commit-message {
            color: var(--text-secondary);
        }

        .timestamp {
            color: var(--text-secondary);
            text-align: right;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <div class="repository-container">
        <div class="header-controls">
            <h2>VORTEX / Index</h2>
            <input type="text" id="searchInput" class="search-box" placeholder="Zoek bestanden...">
        </div>

        <table class="file-table">
            <thead>
                <tr>
                    <th>Bestandsnaam</th>
                    <th>Laatste wijziging</th>
                    <th style="text-align: right;">Tijd</th>
                </tr>
            </thead>
            <tbody id="fileList">
                <!-- Data wordt hier dynamisch ingeladen via JavaScript -->
            </tbody>
        </table>
    </div>

    <script>
        // Dataset op basis van de aangeleverde structuur (met geneutraliseerde namen)
        const fileData = [
            { name: "andersomland.html", message: "Add files via upload", time: "4 months ago" },
            { name: "andersomland1.html", message: "Add files via upload", time: "4 months ago" },
            { name: "andersomland2.html", message: "Add files via upload", time: "4 months ago" },
            { name: "andersomland3.html", message: "Add files via upload", time: "4 months ago" },
            { name: "cyberquota.html", message: "Add files via upload", time: "4 months ago" },
            { name: "index.html", message: "Create index.html", time: "1 minute ago" },
            { name: "network_host_discovery.html", message: "Add files via upload", time: "4 months ago" },
            { name: "sill.html", message: "Add files via upload", time: "4 months ago" },
            { name: "sillly.html", message: "Add files via upload", time: "4 months ago" },
            { name: "vortex_players_export.html", message: "Add files via upload", time: "4 months ago" },
            { name: "vortex_postman_metrics.html", message: "Add files via upload", time: "4 months ago" },
            { name: "vortex_node_192_168_1_1.html", message: "Add files via upload", time: "4 months ago" },
            { name: "vortex_node_status_update.html", message: "Add files via upload", time: "4 months ago" },
            { name: "vortex_node_videre10.html", message: "Add files via upload", time: "4 months ago" }
        ];

        const fileListElement = document.getElementById('fileList');
        const searchInput = document.getElementById('searchInput');

        // Functie om de tabel te renderen
        function renderFiles(files) {
            fileListElement.innerHTML = ''; // Maak tabel leeg

            if (files.length === 0) {
                fileListElement.innerHTML = `<tr><td colspan="3" style="text-align: center; color: #8b949e;">Geen bestanden gevonden</td></tr>`;
                return;
            }

            files.forEach(file => {
                const row = document.createElement('tr');
                
                row.innerHTML = `
                    <td>
                        <span class="file-icon">📄</span>
                        <a href="#" class="file-name">${file.name}</a>
                    </td>
                    <td class="commit-message">${file.message}</td>
                    <td class="timestamp">${file.time}</td>
                `;
                
                fileListElement.appendChild(row);
            });
        }

        // Event listener voor de zoekfunctionaliteit
        searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filteredFiles = fileData.filter(file => 
                file.name.toLowerCase().includes(searchTerm) || 
                file.message.toLowerCase().includes(searchTerm)
            );
            renderFiles(filteredFiles);
        });

        // Initiele render
        renderFiles(fileData);
    </script>

</body>
</html>
